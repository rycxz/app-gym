name: Pruebas y publicación
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      paquete: ${{ steps.nombre.outputs.paquete }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm test
        working-directory: app
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -q -B test
        working-directory: rutina
      # Nombre propio por intento: así se puede relanzar sin duplicar el paquete.
      - id: nombre
        run: echo "paquete=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/www
          name: ${{ steps.nombre.outputs.paquete }}
  pages:
    if: github.event_name == 'push'
    needs: pruebas
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - name: Esperar a que GitHub liste el paquete
        run: sleep 20
      - id: d
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.pruebas.outputs.paquete }}
